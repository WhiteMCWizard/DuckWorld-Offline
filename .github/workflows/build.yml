name: Build DuckWorld Offline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ./Assembly-CSharp.csproj

    - name: Build project
      run: dotnet build ./Assembly-CSharp.csproj --configuration Release --no-restore

    - name: Copy output DLL
      run: |
        mkdir -p artifact
        cp ./bin/Release/net35/Assembly-CSharp.dll artifact/
        cp ./bin/Release/net35/Assembly-CSharp.pdb artifact/ || true

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Assembly-CSharp
        path: artifact/*
        retention-days: 30

    - name: Display build output
      run: |
        echo "Build completed successfully!"
        find . -path "*/bin/Release/Assembly-CSharp.dll" -exec ls -la {} \;

    - name: Generate release tag
      if: github.event_name == 'push'
      id: tag
      run: |
        echo "tag=build-$(date +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  windows-installer:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      run: rustup default stable

    - name: Build Windows installer
      run: cargo build --manifest-path installer/Cargo.toml --release

    - name: Copy installer artifact
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force artifact | Out-Null
        Copy-Item installer/target/release/duckworld-offline-installer.exe artifact/DuckWorld-Offline-Installer.exe

    - name: Upload Windows installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: DuckWorld-Offline-Installer-Windows
        path: artifact/DuckWorld-Offline-Installer.exe
        retention-days: 30

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - build
      - windows-installer
    permissions:
      contents: write

    steps:
    - name: Download release artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.build.outputs.release_tag }}
        name: "Build ${{ needs.build.outputs.release_tag }}"
        body: |
          Automated build from commit ${{ github.sha }}
          Branch: `${{ github.ref_name }}`
        files: |
          release-artifacts/Assembly-CSharp/Assembly-CSharp.dll
          release-artifacts/Assembly-CSharp/Assembly-CSharp.pdb
          release-artifacts/DuckWorld-Offline-Installer-Windows/DuckWorld-Offline-Installer.exe
        fail_on_unmatched_files: false
